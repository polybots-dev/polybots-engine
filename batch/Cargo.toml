[package]
name = "engine-fast-batch"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "Many engine-fast games per call: views and legal moves out, one move per game in."
license = "Apache-2.0"
publish = false

[dependencies]
engine-fast = { path = ".." }
engine-fast-frame = { path = "../frame" }
rayon = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# overflow checks on, as in every build the engine is tested with
overflow-checks = true
