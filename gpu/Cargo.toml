[package]
name = "engine-fast-gpu"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "GPU backend for engine-fast: the rules in a C subset built for the host and for CUDA, checked bit for bit against the Rust engine."
license = "Apache-2.0"
publish = false

[features]
# build the device code with nvcc and link the CUDA runtime (needs the CUDA toolkit)
cuda = []

[dependencies]
engine-fast = { path = ".." }
serde_json = "1"
engine-fast-frame = { path = "../frame" }
engine-fast-batch = { path = "../batch" }
serde = { version = "1", features = ["derive"] }


[[bin]]
name = "view_bench"
required-features = ["cuda"]

[[bin]]
name = "step_bench"
required-features = ["cuda"]

[[bin]]
name = "batch_bench"
required-features = ["cuda"]

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
overflow-checks = true

[[bin]]
name = "loop_bench"
required-features = ["cuda"]
